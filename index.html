<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expense Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Private expense tracker that works offline and syncs to your Google Sheet.">
<meta name="theme-color" content="#0A0B10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: dark)" href="icons/apple-touch-icon-dark.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabbar"></nav>
  </div>
  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
