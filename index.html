<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Credit Card Expenses</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Private expense tracker that works offline and syncs to your Google Sheet.">
<meta name="theme-color" content="#F4F5FA">
<script>try{var t=localStorage.getItem("el_theme"),d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t}document.querySelector('meta[name="theme-color"]').setAttribute("content",d?"#0A0B10":"#F4F5FA")}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Credit Card Expenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: dark)" href="icons/apple-touch-icon-dark.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabbar"></nav>
  </div>
  <div id="layer"></div>
  <div id="menu"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
